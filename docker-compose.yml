services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      REPOPILOT_DB_PATH: /data/repo_pilot.db
      REPOPILOT_AUTH_MODE: ${REPOPILOT_AUTH_MODE:-required}
      REPOPILOT_SESSION_SECRET: ${REPOPILOT_SESSION_SECRET:?Set REPOPILOT_SESSION_SECRET in your environment}
      REPOPILOT_MAX_USERS: ${REPOPILOT_MAX_USERS:-100}
      REPOPILOT_REGISTRATION_CODE: ${REPOPILOT_REGISTRATION_CODE:?Set REPOPILOT_REGISTRATION_CODE in your environment}
      REPOPILOT_COOKIE_SECURE: ${REPOPILOT_COOKIE_SECURE:-auto}
      FORWARDED_ALLOW_IPS: "*"
      REPOPILOT_RUNNER_URL: http://runner:8090
      MODEL_PROVIDER: ${MODEL_PROVIDER:-disabled}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - repopilot_data:/data
    networks: [default, runner_internal]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    depends_on:
      runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    expose: ["8090"]
    environment:
      RUNNER_PORT: "8090"
      RUNNER_MAX_FILES: "80"
      RUNNER_MAX_TOTAL_BYTES: "3145728"
      RUNNER_MAX_FILE_BYTES: "262144"
      RUNNER_TIMEOUT_SECONDS: "30"
      RUNNER_MAX_LOG_BYTES: "12000"
    networks: [runner_internal]
    read_only: true
    tmpfs:
      - /tmp:size=96m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles: [production]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [default]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  repopilot_data:
  caddy_data:
  caddy_config:

networks:
  default:
    driver: bridge
  runner_internal:
    internal: true
    driver: bridge
