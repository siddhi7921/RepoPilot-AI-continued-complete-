# Render Blueprint for RepoPilot AI.
# The API and runner use paid Starter instances; the API requires a persistent disk
# so SQLite job data survives deploys and restarts. Review costs before deploying.
services:
  - type: web
    name: repopilot-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    disk:
      name: repopilot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: REPOPILOT_DB_PATH
        value: /data/repo_pilot.db
      - key: REPOPILOT_AUTH_MODE
        value: required
      - key: REPOPILOT_SESSION_SECRET
        generateValue: true
      - key: REPOPILOT_REGISTRATION_CODE
        sync: false
      - key: REPOPILOT_COOKIE_SECURE
        value: "true"
      - key: REPOPILOT_MAX_USERS
        value: "100"
      - key: REPOPILOT_RUNNER_URL
        value: http://repopilot-runner:8090
      - key: MODEL_PROVIDER
        value: disabled
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_BASE_URL
        value: https://api.openai.com/v1
      - key: MODEL_NAME
        value: gpt-4o-mini
      - key: GITHUB_TOKEN
        sync: false

  - type: pserv
    name: repopilot-runner
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile.runner
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      - key: RUNNER_PORT
        value: "8090"
      - key: RUNNER_MAX_FILES
        value: "80"
      - key: RUNNER_MAX_TOTAL_BYTES
        value: "3145728"
      - key: RUNNER_MAX_FILE_BYTES
        value: "262144"
      - key: RUNNER_TIMEOUT_SECONDS
        value: "30"
      - key: RUNNER_MAX_LOG_BYTES
        value: "12000"
